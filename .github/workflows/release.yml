name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Automated release build with offline LLM support'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x ./gradlew

      - name: Setup Keystore & Signing Configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.STORE_PASSWORD }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          
          # Priority 1: Check if KEYSTORE_BASE64 secret is provided in GitHub Secrets
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Loading release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "STORE_PASSWORD=${STORE_PWD:-ResoLocalAI@2026}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PWD:-${STORE_PWD:-ResoLocalAI@2026}}" >> $GITHUB_ENV
            echo "KEY_ALIAS=reso_release" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV
          # Priority 2: Use the pre-generated release.keystore.base64 file committed to repository
          elif [ -f release.keystore.base64 ]; then
            echo "Loading bundled release.keystore.base64..."
            base64 -d release.keystore.base64 > release.keystore
            echo "STORE_PASSWORD=ResoLocalAI@2026" >> $GITHUB_ENV
            echo "KEY_PASSWORD=ResoLocalAI@2026" >> $GITHUB_ENV
            echo "KEY_ALIAS=reso_release" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV
          # Priority 3: Fallback on-the-fly generation
          else
            echo "Generating production release keystore on the fly..."
            STORE_PASS="ResoLocalAI@2026"
            KEY_PASS="ResoLocalAI@2026"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias reso_release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Reso Local AI, OU=AI Systems, O=Reso, L=Global, S=Global, C=US"
            
            echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=reso_release" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Locate and Prepare Release APK
        id: apk_locator
        run: |
          mkdir -p release_outputs
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" release_outputs/Reso-Local-Release.apk
            echo "Found Release APK: $RELEASE_APK"
          else
            echo "Error: Release APK not found!"
            exit 1
          fi
          
          ls -la release_outputs/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reso-local-release-apk
          path: release_outputs/Reso-Local-Release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: ${{ github.event.inputs.release_name || github.ref_name }}
          body: |
            ## 🚀 Reso Local AI - Official Release (Production APK)
            
            ${{ github.event.inputs.release_notes || 'Official signed release build of Reso Local AI with on-device LLM capabilities.' }}
            
            ### 📦 Download Release:
            - **Reso-Local-Release.apk** (Production Signed APK ready to install)
          files: |
            release_outputs/Reso-Local-Release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
